# annals configuration.
#
# Discovery: every directory under [workspace] root that carries a
# patchnotes.md is a release repo. Directories in stats_only are owned repos
# without a patchnotes.md: tracked for commit activity only. Everything in
# exclude is never touched (reference clones by policy, the two local-only
# audit repos, and repos retired from the portfolio record). Directories
# matching none of those are surfaced in the run summary as ignored, so a
# new owned repo is never silently missed.

[workspace]
root = "~/.gitrepos"

# Reference clones (not Brandon's code), the local-only audit repos, and
# meoweconomy (retired from the portfolio record 2026-08-08; remote is not
# VirInvictus).
exclude = [
    "annas-archive-outter", "Apostrophe", "Awful.app", "blightmud", "calibre",
    "deadbeef", "DeDRM_tools", "developer-site", "ebook-fonts",
    "godot-simplified-flightsim", "gtksourceview", "hyprland-wiki",
    "jellyfin-tizen", "jellyfin-web", "kalker", "koreader", "llama.cpp",
    "notecalc3", "numbat", "quickshell-refs", "quickshell-web", "SpookiUI",
    "zelda3", "audit", "audit-final", "meoweconomy",
]

# Owned repos without a patchnotes.md: commits count, no releases.
stats_only = [
    "1-timezone", "dead-reckoning-bookend-preset", "VirInvictus",
    "VirInvictus.github.io", "Coffer", "project-void", "project-yeschef",
]

[run]
# Where the generated record lands; relative paths resolve against this
# file's directory (the repo root).
output = "ANNALS.md"

[stats]
# Commit statistics count work authored by these identities (git --author
# patterns, OR). Empty the list to count every commit on HEAD; fork repos
# carry upstream history that otherwise lands in the totals.
authors = ["larocque.brandon@gmail.com"]
# The attribution line the record prints (masthead and Coverage); the raw
# git filter identities above stay the machine truth.
authors_display = "Brandon LaRocque"

[languages]
# Repos excluded from the language distribution only (commits and releases
# still count them): fork checkouts whose trees carry upstream code.
exclude = ["Carrel-calibre-web"]

# One-line description per tracked repo, shown in the dashboard table.
# New repos surface in the run summary as a reminder to add theirs.
[descriptions]
"Atrium" = "Native Linux task manager: Org-mode internals, Things 3 / OmniFocus surface, local-first SQLite."
"AudiobookTools" = "Declarative tag-and-folder normalizer for the audiobook library; dry-run default, reversible --apply, never re-encodes."
"bindery-cli" = "CLI that repairs broken EPUBs with deterministic, epubcheck-gated fixes, atomically and in place inside a Calibre library."
"CalibreQuarry" = "CLI toolkit over Calibre's metadata.db: catalogs, stats, audits, parity search, and a pre-import curation screen."
"Carrel" = "Contract and theme for a single-user Calibre reading room (CSS + docs; the code lives in the calibre-web fork)."
"Carrel-calibre-web" = "Fork of calibre-web carrying Carrel's code: single-user, database attached read-only, reads through cquarry."
"Catagotchi" = "Cozy cat tamagotchi wrapped around an idle empire; everything on screen is generated in code (Godot)."
"Colophon" = "GTK4 statistics viewer for KOReader reading logs; imports a copy of statistics.sqlite3, Cairo charts."
"Conservatory" = "Calibre for audio: a native library manager that owns and moves music, podcasts, and audiobooks on disk, with a libmpv player."
"crash-course" = "Arcade aircraft-crash damage-maximizer (Burnout's crash mode rebuilt around airliners), built for my son."
"cquarry" = "Canonical read-only Calibre database layer with a faithful port of Calibre's search grammar; the opt-in write module is the one sanctioned mutation path."
"deadbeef-cui" = "Faceted library-browser plugin for DeaDBeeF in the Columns UI style, on medialib and scriptable presets."
"dead-reckoning-bookend-preset" = "One-file KOReader preset: session pace, chapter ETA, projected finish."
"Docket" = "Native GTK4 plain-text task editor, clean-room faithful to the TaskPaper 3 format and query language."
"dragon-agents" = "Local ZCode plugin of twenty-three read-only research subagents: repo mapping, release audits, CI triage, markets and finance briefs."
"dragon-themer" = "Theme engine for the whole machine: one palette rendered into every colour-bearing config."
"Foyer" = "Shared front door to Hearth and Haveli: game launcher plus LAN lobby; holds no game rules."
"Framework" = "Native GTK4 document viewer for PDF, DjVu, comics, and EPUB-class ebooks, on twin render pipelines."
"Haveli" = "Two-player LAN digital build of Jaipur on a content-agnostic deterministic engine (private: the faithful dataset is git-ignored)."
"Hearth" = "Two-player LAN digital build of A Feast for Odin on the same engine shape (private: the faithful dataset is git-ignored)."
"Hearthfall" = "Grimdark clan-survival terminal game: stdlib-only engine, single seeded RNG, Textual TUI."
"Hermitage" = "Visually immersive GTK4 gallery browser for Calibre libraries, reading metadata.db read-only; ships a Flatpak."
"kanagawa-dragon-nvim-emacs" = "Faithful Emacs deftheme port of the Kanagawa Dragon palette, mapping every Emacs 29+ tree-sitter face."
"lattice-music" = "CLI/TUI for music collections: ~30 read-only audit and visualization modes with the filesystem as source of truth; writes are explicit and opt-in."
"opends" = "Open toolkit and bugfix patches for SSI's Dark Sun CRPGs: save inspectors, format extractors, disassemblers, darkfixes."
"Quire" = "Soulver-style notepad calculator for Linux: plain-text sheets where prose and expressions share the page and answers fill a results column."
"raindrop-cli" = "Dependency-free Raindrop.io CLI for bookmarks, collections, tags, and highlights, with a Pinboard backend and two-way sync."
"saforums.koplugin" = "KOReader plugin reading the Something Awful Forums as native e-reader widgets: login, unread tracking, bookmarks."
"Topograph" = "Filesystem size explorer: lazy tree view plus a squarified cushion treemap (a qdirstat analog)."
"Vestibule" = "One-directional Obsidian-vault to org-roam converter with a dry-run install."
"Viaduct" = "Linux port of NetNewsWire: local-first RSS reader, single-writer SQLite, FTS5 search, Inoreader sync."
"vir-gtk" = "Shared GTK4 styling and D-Bus portal layer for the Vir Invictus desktop suite (replaces libadwaita)."
"vir-search" = "Domain-agnostic Rust library parsing Calibre-style search expressions into a typed AST."
"vir-tui" = "TUI primitive library (curses menus, prompts, progress, mouse plus type-to-filter) powering the Python CLI toolchain."
"whisker-street" = "Discord stock market where the server members are the stocks: presence-driven prices and a CPMM market maker."
"annals" = "This generator: the workspace's whole work record, rendered from every repo's patchnotes and git history."
"1-timezone" = "KOReader user patch forcing a correct POSIX TZ inside the process."
"2-kobo-style-sleepscreen-banner-prettified" = "KOReader user patch redrawing the sleep screen as a Kobo-style floating card (prettified fork)."
"Coffer" = "Native GTK4 envelope-budgeting app over a plain-text hledger journal (the journal is the database)."
"project-void" = "Party-based isometric CRPG in the Dark Sun / Fallout 2 lineage on lethal Cairn combat math (pre-development)."
"project-yeschef" = "Grand-strategy restaurant sim in the CK3 / Victoria 3 lineage; you play the General Manager (pre-development)."
"VirInvictus" = "The GitHub profile README repo: one line and a shipping status per project."
"VirInvictus.github.io" = "This site: static Jekyll on GitHub Pages; /patchnotes/ serves the annals record."

