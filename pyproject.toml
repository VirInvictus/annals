[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "annals"
version = "0.6.0"
description = "Workspace work-record generator: renders a directory of repos' patchnotes and git history into one ANNALS.md dashboard and timeline."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
keywords = ["changelog", "patchnotes", "workspace", "git", "report"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control",
]
dependencies = []

[project.scripts]
annals = "annals.cli:main"

[project.urls]
Homepage = "https://github.com/VirInvictus/annals"
Changelog = "https://github.com/VirInvictus/annals/blob/main/patchnotes.md"

[tool.hatch.build.targets.wheel]
packages = ["src/annals"]

[tool.ruff.lint]
# The bindery house set: ruff defaults plus import sorting (I), pyupgrade (UP),
# and bugbear (B), pinned so `ruff check` means the same thing everywhere.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = ["pytest"]
